<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student Practice Quiz - FunLMS Kids</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0df259", // Bright Green
                        "primary-hover": "#0bc448",
                        "background-light": "#f5f8f6",
                        "background-dark": "#102216",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a3524",
                        "text-main": "#0d1c12",
                        "text-muted": "#526358",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem", 
                        "lg": "1rem", 
                        "xl": "1.5rem", 
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(13, 242, 89, 0.15)',
                        'card': '0 2px 8px rgba(0, 0, 0, 0.05)',
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main dark:text-gray-100 min-h-screen flex flex-col overflow-x-hidden antialiased transition-colors duration-200">
<!-- Main Container -->
<div class="flex-1 flex flex-col w-full max-w-md mx-auto relative h-full">
<!-- Header -->
<header class="flex items-center justify-between px-6 py-4 pt-6 shrink-0">
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-white dark:bg-surface-dark shadow-sm hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-text-muted dark:text-gray-300">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<div class="flex items-center gap-2 bg-white dark:bg-surface-dark px-4 py-2 rounded-full shadow-sm border border-gray-100 dark:border-gray-800">
<span class="text-yellow-400 material-symbols-outlined text-[20px] font-variation-settings-fill">star</span>
<span class="text-text-main dark:text-white font-bold text-sm tracking-wide">250</span>
</div>
</header>
<!-- Progress Bar Section -->
<div class="px-6 py-2 shrink-0">
<div class="flex justify-between items-end mb-2">
<span class="text-sm font-bold text-text-muted dark:text-gray-400">Question 3 of 10</span>
<span class="text-xs font-semibold text-primary">30%</span>
</div>
<div class="h-3 w-full bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 30%"></div>
</div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-6 py-4 flex flex-col items-center">
<!-- Headline -->
<h1 class="text-2xl md:text-3xl font-extrabold text-center text-text-main dark:text-white leading-tight mb-6">
                Match the picture with the word
            </h1>
<!-- Hero Image -->
<div class="w-full max-w-[320px] aspect-square bg-white dark:bg-surface-dark rounded-3xl p-4 shadow-card mb-8 flex items-center justify-center relative group">
<!-- Decorative background elements -->
<div class="absolute inset-0 bg-primary/5 rounded-3xl z-0"></div>
<div class="absolute -top-4 -right-4 w-12 h-12 bg-yellow-100 dark:bg-yellow-900/30 rounded-full blur-xl z-0"></div>
<div class="absolute -bottom-4 -left-4 w-16 h-16 bg-blue-100 dark:bg-blue-900/30 rounded-full blur-xl z-0"></div>
<!-- Main Image -->
<div class="relative w-full h-full bg-contain bg-center bg-no-repeat z-10 transition-transform duration-300 group-hover:scale-105" data-alt="A bright red apple with a green leaf on a clean background" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCbCzj-CYZsf0cthTAyNlErntLzV6ubmB_ARdyRCkoHiYyUzYu9DpNcBtXcG8OV2D9n8dMLmAj15eGW6fZe3aMg0w2daaqY9XCruqbsGzNIVLRWjNaiqQeZzZCoBVdGiUVxQQewhgwdHK7m-NvBImsNJ6LXtsR4K_82Cm4s0D3ARQe6eGtm8z4zqHMHOTqGJLAgvMWZs_PjNxd4CBzjV2nJ3nO0XgK6YlZwP74bC1gUcazxPcglLh9RcV99MOA37i9gM_DtFoWhUEk');">
</div>
</div>
<!-- Answer Grid -->
<div class="w-full grid grid-cols-2 gap-4 mb-24">
<!-- Option 1 (Correct) -->
<button class="relative group flex flex-col items-center justify-center p-4 h-24 rounded-2xl bg-white dark:bg-surface-dark border-2 border-gray-100 dark:border-gray-700 shadow-sm hover:border-primary dark:hover:border-primary hover:bg-green-50 dark:hover:bg-green-900/20 hover:shadow-md transition-all duration-200">
<span class="text-lg font-bold text-text-main dark:text-white">Apple</span>
<div class="absolute top-3 right-3 w-5 h-5 rounded-full border-2 border-gray-200 dark:border-gray-600 group-hover:border-primary group-hover:bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-white text-[14px] opacity-0 group-hover:opacity-100">check</span>
</div>
</button>
<!-- Option 2 -->
<button class="relative group flex flex-col items-center justify-center p-4 h-24 rounded-2xl bg-white dark:bg-surface-dark border-2 border-gray-100 dark:border-gray-700 shadow-sm hover:border-primary dark:hover:border-primary hover:bg-green-50 dark:hover:bg-green-900/20 hover:shadow-md transition-all duration-200">
<span class="text-lg font-bold text-text-main dark:text-white">Ball</span>
<div class="absolute top-3 right-3 w-5 h-5 rounded-full border-2 border-gray-200 dark:border-gray-600 group-hover:border-primary group-hover:bg-primary flex items-center justify-center transition-colors"></div>
</button>
<!-- Option 3 -->
<button class="relative group flex flex-col items-center justify-center p-4 h-24 rounded-2xl bg-white dark:bg-surface-dark border-2 border-gray-100 dark:border-gray-700 shadow-sm hover:border-primary dark:hover:border-primary hover:bg-green-50 dark:hover:bg-green-900/20 hover:shadow-md transition-all duration-200">
<span class="text-lg font-bold text-text-main dark:text-white">Ant</span>
<div class="absolute top-3 right-3 w-5 h-5 rounded-full border-2 border-gray-200 dark:border-gray-600 group-hover:border-primary group-hover:bg-primary flex items-center justify-center transition-colors"></div>
</button>
<!-- Option 4 -->
<button class="relative group flex flex-col items-center justify-center p-4 h-24 rounded-2xl bg-white dark:bg-surface-dark border-2 border-gray-100 dark:border-gray-700 shadow-sm hover:border-primary dark:hover:border-primary hover:bg-green-50 dark:hover:bg-green-900/20 hover:shadow-md transition-all duration-200">
<span class="text-lg font-bold text-text-main dark:text-white">Axe</span>
<div class="absolute top-3 right-3 w-5 h-5 rounded-full border-2 border-gray-200 dark:border-gray-600 group-hover:border-primary group-hover:bg-primary flex items-center justify-center transition-colors"></div>
</button>
</div>
</div>
<!-- Bottom Actions (Fixed/Sticky) -->
<div class="absolute bottom-0 left-0 w-full bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 p-4 pb-6 z-20">
<div class="flex gap-4 items-center max-w-md mx-auto">
<!-- Hint Button -->
<button aria-label="Get a hint" class="shrink-0 w-14 h-14 rounded-2xl bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-300 flex items-center justify-center hover:bg-blue-100 dark:hover:bg-blue-900/40 transition-colors">
<span class="material-symbols-outlined text-[28px]">smart_toy</span>
</button>
<!-- Check Button -->
<button class="flex-1 h-14 rounded-2xl bg-primary hover:bg-primary-hover shadow-soft text-black font-extrabold text-lg tracking-wide flex items-center justify-center gap-2 transform active:scale-[0.98] transition-all duration-150">
<span>Check Answer</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
